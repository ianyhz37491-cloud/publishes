name: Build and publish Zephyr landscape
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public publishing repository
        uses: actions/checkout@v4

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch pinned upstream Zephyr source
        run: |
          git clone --no-checkout https://github.com/RetherSzu/zephyr.git zephyr
          cd zephyr
          git checkout --detach bd74c81efa0c49a8f8acc6cab41550dd2f0d95b0

      - name: Apply website landscape changes
        run: |
          python3 patches/apply.py zephyr
          test -f zephyr/src/LiveLandscape.tsx
          test -f zephyr/src/solar.ts
          grep -q 'uCursorForce' zephyr/src/shaders/grass.vert
          grep -q 'uDaylight' zephyr/src/shaders/grass.frag

      - name: Install dependencies and compile production site
        working-directory: zephyr
        run: |
          npm ci --no-audit --no-fund
          npm run build -- --base /publishes/
          test -f dist/index.html

      - name: Install verified CC0 countryside field recordings
        run: |
          mkdir -p zephyr/dist/licenses zephyr/dist/audio
          cp zephyr/LICENSE zephyr/dist/licenses/zephyr-MIT.txt
          cp AUDIO_SOURCES.md zephyr/dist/audio/SOURCES.md
          touch zephyr/dist/.nojekyll
          fetch_checked() {
            local file="$1" source="$2" expected="$3"
            curl -fSL --retry 3 --max-time 60 "$source" -o "zephyr/dist/audio/$file"
            actual="$(git hash-object "zephyr/dist/audio/$file")"
            if [ "$actual" != "$expected" ]; then
              echo "::error::Recording $file did not match the pinned upstream Git blob"
              exit 1
            fi
            test -s "zephyr/dist/audio/$file"
            echo "Verified CC0 recording: $file"
          }
          fetch_checked fields.ogg \
            https://raw.githubusercontent.com/Lelio88/dewdrop/35da4d0ec47d27bf582c7aa7102c40a278eff49b/assets/audio/fields_amb.ogg \
            bf37de39398b06faec45211fc74296c9b12326b2
          fetch_checked meadow.m4a \
            https://raw.githubusercontent.com/abhinandansharma/ambiently/8b99d668e91957d80b66d419fae5cb0dba2be528/demo/public/sounds/meadow.m4a \
            aba2139ac22d3e0bbae7ff1ff722fcac66692fb0
          fetch_checked forest.m4a \
            https://raw.githubusercontent.com/abhinandansharma/ambiently/8b99d668e91957d80b66d419fae5cb0dba2be528/demo/public/sounds/forest.m4a \
            737dbbad5fbf249c78b73d6088da669000f6a5f3
          fetch_checked night.m4a \
            https://raw.githubusercontent.com/abhinandansharma/ambiently/8b99d668e91957d80b66d419fae5cb0dba2be528/demo/public/sounds/night.m4a \
            ac20cb21a3dc6f0d2763db8bee60d102fd88ef5c

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: zephyr/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  verify-live:
    name: Verify the public site serves the application
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check deployed HTML rather than deployment status alone
        env:
          SITE_URL: https://ianyhz37491-cloud.github.io/publishes/
        run: |
          python3 - <<'PY'
          import os, time, urllib.request
          from urllib.parse import urlsplit
          for path in ("", "index.html"):
              url=os.environ["SITE_URL"]+path+"?build="+os.environ["GITHUB_SHA"]
              for attempt in range(12):
                  try:
                      request=urllib.request.Request(url,headers={"Cache-Control":"no-cache","User-Agent":"Zephyr-Pages-Verification/1.0"})
                      with urllib.request.urlopen(request,timeout=15) as response:
                          html=response.read(30000).decode("utf-8","replace")
                      is_app=('id="root"' in html and '/publishes/assets/' in html)
                      print(f"Path /publishes/{path}: attempt {attempt+1}, app={is_app}",flush=True)
                      if is_app:
                          break
                  except Exception as exc:
                      print(f"Path /publishes/{path}: attempt {attempt+1}: {type(exc).__name__}: {exc}",flush=True)
                  time.sleep(8)
              else:
                  raise SystemExit(f"FAIL: {url} does not serve the app. Check Pages source, CDN and index routing.")
          print("Verified both /publishes/ and /publishes/index.html serve the Zephyr Vite app.",flush=True)
          PY
